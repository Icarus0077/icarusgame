<VirtualHost *:443>
    ServerName gameserver.rene007.nl
    ServerAdmin admin@rene007.nl
    SSLEngine On
    SSLCertificateFile /etc/letsencrypt/live/gameserver.rene007.nl/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/gameserver.rene007.nl/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf
    Include /etc/apache2/icarus-control-web-auth.conf
    ErrorLog ${APACHE_LOG_DIR}/gameserver.rene007.nl-error.log
    CustomLog ${APACHE_LOG_DIR}/gameserver.rene007.nl-access.log combined
</VirtualHost>
