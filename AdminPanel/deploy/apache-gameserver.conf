<VirtualHost *:80>
    ServerName gameserver.rene007.nl
    ServerAdmin admin@rene007.nl

    # Credentials and session cookies are accepted only over HTTPS.
    Redirect permanent / https://gameserver.rene007.nl/

    ErrorLog ${APACHE_LOG_DIR}/gameserver.rene007.nl-error.log
    CustomLog ${APACHE_LOG_DIR}/gameserver.rene007.nl-access.log combined
</VirtualHost>
