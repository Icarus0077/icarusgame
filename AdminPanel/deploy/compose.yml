services:
  icarus-control:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: icarus-control
    restart: unless-stopped
    ports:
      - "127.0.0.1:3100:3000"
    volumes:
      - /var/lib/icarus-control:/data
      - /opt/icarus-control/secrets/runtime.env:/run/secrets/icarus.env:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
