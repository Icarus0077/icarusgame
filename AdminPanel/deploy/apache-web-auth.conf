# Included only by this game's HTTPS virtualhost. Modules: auth_form,
# request, authn_file, session, session_cookie, session_crypto, headers, proxy_http.
ProxyPreserveHost On
ProxyAddHeaders On
ProxyTimeout 60
ProxyPassMatch "^/(?:login/?|auth/(?:login|logout))$" "!"
ProxyPass / http://127.0.0.1:3100/ retry=0 timeout=60
ProxyPassReverse / http://127.0.0.1:3100/

AliasMatch "^/login/?$" "/opt/icarus-control/auth/admin-login.html"
<Directory "/opt/icarus-control/auth">
    AllowOverride None
    Options -Indexes
    Require all granted
</Directory>

# Never accept a caller-supplied identity, including legacy Sites headers.
RequestHeader unset X-Icarus-Admin-User early
RequestHeader unset X-Icarus-Admin-Email early
RequestHeader unset Oai-Authenticated-User-Id early
RequestHeader unset Oai-Authenticated-User-Email early
RequestHeader unset Oai-Authenticated-User-Full-Name early
RequestHeader unset Oai-Authenticated-User-Full-Name-Encoding early

Session On
# This directive takes raw arguments: quotes become part of the cookie header.
# Keep attributes unquoted so browsers accept the __Host- cookie.
SessionCookieName __Host-icarus_admin path=/;HttpOnly;Secure;SameSite=Strict
# Preserve the per-request session cache across mod_auth_form's repeated loads.
# Current mod_session_cookie discards cached entries when Remove is On.
SessionCookieRemove Off
# Strip the encrypted session only during late header fixups, after auth.
# Keep unrelated application cookies intact.
RequestHeader edit* Cookie "(^|;[ \t]*)__Host-icarus_admin=[^;]*" "$1"
RequestHeader edit Cookie "^;[ \t]*" ""
RequestHeader edit Cookie ";[ \t]*$" ""
SessionMaxAge 1800
SessionExpiryUpdateInterval 0
SessionCryptoPassphraseFile /opt/icarus-control/secrets/admin-session.key

<Location "/">
    AuthType form
    AuthName "Icarus Control"
    AuthFormProvider file
    AuthUserFile /etc/apache2/icarus-control.htpasswd
    AuthFormFakeBasicAuth Off
    # The username parser consumes this field first, disabling form-supplied
    # redirects. Verify this invariant with apache-auth-smoke.py on upgrades.
    AuthFormLocation httpd_username
</Location>

# Keep JSON endpoints at 401 when the session expires; only pages redirect.
<LocationMatch "^/(?!login/?$|password-reset(?:\.html)?/?$|auth/(?:login|logout)$|api/game/|api/health$|\.well-known/acme-challenge/)">
    Require valid-user
    RequestHeader set X-Icarus-Admin-User "expr=%{REMOTE_USER}"
    # Preserve the existing principal and permissions for the current account.
    RequestHeader set X-Icarus-Admin-Email "admin@gameserver.rene007.nl" "expr=%{REMOTE_USER} == 'rene'"
    Header always set Cache-Control "no-store"
    # mod_auth_form also supports inline login on protected URLs.
    <If "%{REQUEST_METHOD} !~ /^(GET|HEAD|OPTIONS)$/ && req('Origin') != 'https://gameserver.rene007.nl'">
        Require all denied
    </If>
</LocationMatch>
<LocationMatch "^/(?!login/?$|password-reset(?:\.html)?/?$|auth/(?:login|logout)$|api/|\.well-known/acme-challenge/)">
    AuthFormLoginRequiredLocation "https://gameserver.rene007.nl/login"
</LocationMatch>

<LocationMatch "^/(?:login/?$|password-reset(?:\.html)?/?$|api/game/|api/health$|\.well-known/acme-challenge/)">
    AuthType None
    Require all granted
    Session Off
</LocationMatch>
<LocationMatch "^/login/?$">
    Header always set Cache-Control "no-store"
</LocationMatch>
<LocationMatch "^/(?:password-reset(?:\.html)?/?$|api/game/v1/password-reset/)">
    Header always set Cache-Control "no-store"
    LimitRequestBody 4096
</LocationMatch>

<LocationMatch "^/auth/(?:login|logout)$">
    Require all granted
    LimitRequestBody 8192
    # Native browser POSTs include Origin. Reject cross-site login/logout.
    <If "%{REQUEST_METHOD} != 'POST' || req('Origin') != 'https://gameserver.rene007.nl'">
        Require all denied
    </If>
    Header always set Cache-Control "no-store"
</LocationMatch>
<LocationMatch "^/auth/login$">
    SetHandler form-login-handler
    AuthFormLoginRequiredLocation "https://gameserver.rene007.nl/login?error=1"
    AuthFormLoginSuccessLocation "https://gameserver.rene007.nl/"
</LocationMatch>
<LocationMatch "^/auth/logout$">
    SetHandler form-logout-handler
    AuthFormLogoutLocation "https://gameserver.rene007.nl/login?logged_out=1"
    SessionMaxAge 1
</LocationMatch>

Header always set X-Content-Type-Options "nosniff"
Header always set X-Frame-Options "DENY"
Header always set Referrer-Policy "no-referrer"
Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"
Header always set Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
